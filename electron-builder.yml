appId: com.openflow.linkto
productName: LinkTo
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: true
  hardenedRuntime: false
  # 本地构建：ad-hoc 签名（"-"，不需要证书、不访问 Apple 时间戳服务）。
  # 不能用 null 跳过签名：未封装签名的 bundle 无法使用 macOS 系统通知（UNErrorDomain 错误 1，通知全部失败）
  identity: "-"
dmg:
  # DMG layout: app + Applications link + Gatekeeper helper + install notes.
  # Paths are relative to the repo root (electron-builder must run from there).
  window:
    width: 660
    height: 440
  contents:
    - x: 170
      y: 150
      type: file
    - x: 490
      y: 150
      type: link
      path: /Applications
    - x: 170
      y: 320
      type: file
      path: "packaging/macos/打不开？双击我.command"
    - x: 490
      y: 320
      type: file
      path: packaging/macos/安装说明.txt
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Network;Email;
  target:
    - target: AppImage
      arch:
        - x64
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
