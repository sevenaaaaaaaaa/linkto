appId: com.openflow.linkto
productName: LinkTo
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
  darkModeSupport: true
  hardenedRuntime: false
  # 本地构建：跳过代码签名（Apple 时间戳服务不可达会导致打包失败；自用 dmg 无需签名）
  identity: null
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
