<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mail Studio · 目标风格板 v2</title>
<link rel="stylesheet" href="./tokens-v2.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: oklch(93% 0.004 260); color: oklch(21% 0.008 260); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { background: var(--bg); color: var(--fg); padding: 32px 36px 48px; }
  h1 { font: 600 var(--text-xl)/var(--lh-xl) var(--font-display); letter-spacing: var(--tracking-tight); margin: 0 0 4px; }
  .sub { font-size: var(--text-sm); color: var(--muted); margin: 0 0 28px; }
  h2 { font: 500 var(--text-2xs)/var(--lh-2xs) var(--font-mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--faint); margin: 32px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 92px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border-soft); background: var(--surface-strong); }
  .sw i { display: block; height: 44px; }
  .sw b { display: block; font: 500 11px/14px var(--font-mono); padding: 6px 8px 0; }
  .sw s { display: block; text-decoration: none; font: 400 10px/13px var(--font-mono); color: var(--faint); padding: 0 8px 7px; }
  .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--r-xs); font-size: var(--text-xs); font-weight: 500; }
  .type div { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-soft); padding: 6px 0; }
  .type code { font: 400 11px var(--font-mono); color: var(--faint); width: 132px; flex: none; }
  .sp { display: flex; align-items: flex-end; gap: 10px; }
  .sp span { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 400 10px var(--font-mono); color: var(--faint); }
  .sp i { display: block; background: var(--accent-soft); border: 1px solid var(--accent); width: 18px; }
  .rad { display: flex; gap: 12px; }
  .rad span { width: 64px; height: 48px; border: 1px solid var(--border-strong); background: var(--surface-strong); display: grid; place-items: center; font: 400 10px var(--font-mono); color: var(--faint); }
  /* 迷你三栏：目标 IA 示意 */
  .app { margin-top: 12px; height: 340px; border-radius: var(--r-lg); border: 1px solid var(--border); overflow: hidden; display: grid; grid-template-columns: 150px 210px 1fr; position: relative;
         background: radial-gradient(60% 50% at 90% 0%, var(--blob-a), transparent 70%), var(--bg); box-shadow: var(--shadow); }
  .side { background: var(--surface); backdrop-filter: blur(20px); border-right: 1px solid var(--border-soft); padding: 30px 6px 6px; font-size: 12px; }
  .side .g { font: 500 9.5px var(--font-mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--faint); padding: 10px 8px 4px; display: flex; justify-content: space-between; }
  .si { height: 24px; display: flex; align-items: center; gap: 7px; padding: 0 8px; border-radius: var(--r-sm); color: var(--fg); }
  .si em { margin-left: auto; font: 400 10px var(--font-mono); font-style: normal; color: var(--faint); }
  .si.on { background: var(--selected); color: var(--accent-ink); font-weight: 500; }
  .si.on em { color: var(--accent-ink); }
  .dot { width: 6px; height: 6px; border-radius: 9px; background: currentColor; opacity: .55; flex: none; }
  .list { background: var(--surface-strong); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; }
  .lh { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--border-soft); font-size: 12px; font-weight: 600; }
  .lh .seg { margin-left: auto; display: flex; gap: 2px; background: var(--hover); border-radius: var(--r-sm); padding: 2px; }
  .lh .seg b { font-weight: 500; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; color: var(--muted); }
  .lh .seg b.on { background: var(--surface-strong); color: var(--fg); box-shadow: var(--shadow-sm); }
  .mi { padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--border-soft); position: relative; font-size: 11.5px; }
  .mi .t { display: flex; justify-content: space-between; font-weight: 600; }
  .mi .t span { font: 400 10px var(--font-mono); color: var(--faint); }
  .mi .s { color: var(--fg); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .p { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .mi.sel { background: var(--selected); }
  .mi.un::before { content: ''; position: absolute; left: 5px; top: 13px; width: 5px; height: 5px; border-radius: 9px; background: var(--accent); }
  .mi.read .t { font-weight: 500; color: var(--muted); }
  .rd { padding: 0; display: flex; flex-direction: column; background: var(--surface-strong); }
  .rt { height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--border-soft); }
  .btn { height: 24px; padding: 0 8px; border-radius: var(--r-sm); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; }
  .btn.p { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  .sep { width: 1px; height: 14px; background: var(--border); margin: 0 4px; }
  .rb { padding: 16px 18px; }
  .rb h3 { font: 600 15px/20px var(--font-display); margin: 0 0 4px; letter-spacing: var(--tracking-tight); }
  .rb .m { font-size: 11px; color: var(--faint); margin-bottom: 12px; }
  .ai { border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent-ink); padding: 8px 10px; font-size: 11px; margin-bottom: 12px; }
  .rb p { font-size: 12px; line-height: 20px; color: var(--fg); margin: 0 0 6px; }
  .bulk { position: absolute; left: 172px; bottom: 14px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: var(--r-md);
          background: var(--surface); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 11px; }
  .bulk .btn { color: var(--fg); }
  .bulk .n { padding: 0 8px; color: var(--accent-ink); font-weight: 600; }
  kbd { font: 500 9.5px var(--font-mono); padding: 1px 4px; border-radius: var(--r-xs); border: 1px solid var(--border); color: var(--faint); margin-left: 4px; }
  .curves { display: flex; gap: 10px; }
  .curves svg { background: var(--surface-strong); border: 1px solid var(--border-soft); border-radius: var(--r-md); }
  .curves text { font: 400 9px var(--font-mono); fill: var(--faint); }
  .rules { font-size: var(--text-sm); line-height: 20px; color: var(--muted); margin: 0; padding-left: 18px; }
  .rules b { color: var(--fg); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
<script>
const tpl = (theme) => `
<section class="pane" data-theme="${theme}">
  <h1>Mail Studio · 风格板 v2</h1>
  <p class="sub">${theme === 'light' ? '浅色 · 石墨纸' : '深色 · 石墨夜'} — 铜绿 Verdigris 单 accent · 克制 / 精确 / 一致</p>

  <h2>01 · 色板</h2>
  <div class="row">
    ${[['bg','--bg'],['bg-soft','--bg-soft'],['surface','--surface-strong'],['border','--border'],['faint','--faint'],['muted','--muted'],['fg','--fg']].map(([n,v])=>`<div class="sw"><i style="background:var(${v})"></i><b>${n}</b><s>${v}</s></div>`).join('')}
  </div>
  <div class="row" style="margin-top:8px">
    ${[['accent','--accent'],['accent-ink','--accent-ink'],['ok','--ok'],['warn','--warn'],['danger','--danger'],['info','--info'],['selected','--selected']].map(([n,v])=>`<div class="sw"><i style="background:var(${v})"></i><b>${n}</b><s>${v}</s></div>`).join('')}
  </div>
  <div class="row" style="margin-top:12px">
    <span class="chip" style="background:var(--accent-soft);color:var(--accent-ink)">个人</span>
    <span class="chip" style="background:var(--warn-soft);color:var(--warn-ink)">通知</span>
    <span class="chip" style="background:oklch(from var(--cat-newsletter) l c h / .12);color:var(--cat-newsletter)">订阅</span>
    <span class="chip" style="background:var(--hover);color:var(--faint)">噪声</span>
    <span class="chip" style="background:var(--ok-soft);color:var(--ok-ink)">已连接</span>
    <span class="chip" style="background:var(--danger-soft);color:var(--danger-ink)">同步失败</span>
    <span class="chip" style="background:var(--info-soft);color:var(--info-ink)">验证码 482913</span>
  </div>

  <h2>02 · 字号表（7 级）</h2>
  <div class="type">
    <div><code>xl 26/32 · 600</code><span style="font:600 var(--text-xl)/var(--lh-xl) var(--font-display);letter-spacing:var(--tracking-tight)">今天的商情</span></div>
    <div><code>lg 20/26 · 600</code><span style="font:600 var(--text-lg)/var(--lh-lg) var(--font-display);letter-spacing:var(--tracking-tight)">关于 Q4 联合推广方案的三个方向</span></div>
    <div><code>md 16/22 · 600</code><span style="font-size:var(--text-md);font-weight:600">账户与同步</span></div>
    <div><code>base 14/22 · 400</code><span style="font-size:var(--text-base)">整理了三个方向：设计社区联合活动、联名内容共创。</span></div>
    <div><code>sm 13/18 · 400/500</code><span style="font-size:var(--text-sm)">统一收件箱 · 9 月报销单待你审批</span></div>
    <div><code>xs 12/16 · 400</code><span style="font-size:var(--text-xs);color:var(--muted)">林晓雯 · 23:24 · 2 个附件</span></div>
    <div><code>2xs 11/14 · mono</code><span style="font:500 var(--text-2xs) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--faint)">Accounts · ⌘K</span></div>
  </div>

  <h2>03 · 间距表（4px 基线）</h2>
  <div class="sp">${[2,4,6,8,12,16,20,24,32,48].map(n=>`<span><i style="height:${n}px"></i>${n}</span>`).join('')}</div>

  <h2>04 · 圆角与描边</h2>
  <div class="rad">${[['xs',4],['sm',6],['md',10],['lg',14]].map(([n,r])=>`<span style="border-radius:${r}px">${n} ${r}</span>`).join('')}<span style="border-radius:9999px;width:48px">full</span>
  <span style="border-radius:var(--r-sm);box-shadow:var(--focus-ring);border-color:transparent">focus</span></div>

  <h2>05 · 材质 + 目标信息架构示意</h2>
  <div class="app">
    <div class="side">
      <div class="si on"><span class="dot"></span>收件箱<em>17</em></div>
      <div class="si"><span class="dot"></span>旗标</div>
      <div class="si"><span class="dot"></span>已发送</div>
      <div class="g">队列 <span>3</span></div>
      <div class="si"><span class="dot"></span>稍后处理</div>
      <div class="si"><span class="dot"></span>待审批<em>3</em></div>
      <div class="si"><span class="dot"></span>待跟进</div>
      <div class="g">智能</div>
      <div class="si"><span class="dot"></span>洞察</div>
      <div class="si"><span class="dot"></span>知识库</div>
      <div class="si"><span class="dot"></span>Agent</div>
      <div class="g">账户 ▾</div>
    </div>
    <div class="list">
      <div class="lh">收件箱 <span style="font-weight:400;color:var(--faint);font-size:10.5px">16</span>
        <div class="seg"><b class="on">重要</b><b>其他</b><b>未读</b></div></div>
      <div class="mi un sel"><div class="t">林晓雯<span>23:24</span></div><div class="s">关于 Q4 联合推广方案的三个方向</div><div class="p">整理了三个方向：设计社区联合活动…</div></div>
      <div class="mi un"><div class="t">财务部 · 周敏<span>21:18</span></div><div class="s">9 月报销单待你审批（共 4 笔）</div><div class="p">本月报销合计 ¥12,480…</div></div>
      <div class="mi read"><div class="t">张一鸣<span>14:48</span></div><div class="s">LibTV 增长周报 W41 初稿</div><div class="p">本周 DAU 环比 +6.2%…</div></div>
      <div class="mi read"><div class="t">陈思远<span>昨天</span></div><div class="s">报价单 v3 &amp; 交付排期</div><div class="p">交付拆为两期…</div></div>
    </div>
    <div class="rd">
      <div class="rt"><span class="btn p">回复</span><span class="btn">全部回复</span><span class="btn">转发</span><span class="sep"></span><span class="btn">归档</span><span class="btn">稍后</span><span class="btn">⋯</span><span style="margin-left:auto" class="btn">AI<kbd>⌘J</kbd></span></div>
      <div class="rb"><h3>关于 Q4 联合推广方案的三个方向</h3><div class="m">林晓雯 · lin@partner-studio.cn · 23:24</div>
        <div class="ai">AI 摘要 · 三个合作方向，周三 15:00 电话确认框架与预算</div>
        <p>Seven 你好，</p><p>整理了三个方向：设计社区联合活动、联名内容共创、交叉投放。</p></div>
    </div>
    <div class="bulk"><span class="n">已选 3</span><span class="btn">归档</span><span class="btn">已读</span><span class="btn">稍后</span><span class="btn">移动</span><span class="btn">⋯</span></div>
  </div>
  <ul class="rules" style="margin-top:12px">
    <li><b>L1 玻璃</b>只给侧栏；<b>内容栏实底</b>；<b>L2 液态玻璃</b>只给浮层（BulkBar、菜单、⌘K）。</li>
    <li>选中 = <code>--selected</code> 底，未读 = accent 圆点，勾选框仅 hover / 多选模式出现。</li>
  </ul>

  <h2>06 · 动效曲线</h2>
  <div class="curves">${[['ease-out','.22,1,.36,1','dur-1/2 · 默认'],['ease-spring','.32,.72,0,1','dur-3 · 进入/morph'],['ease-in','.4,0,1,1','×0.7 · 退出']].map(([n,c,d])=>{const [a,b,e,f]=c.split(',').map(Number);return `<svg width="150" height="110" viewBox="0 0 150 110"><path d="M15 90 C ${15+a*120} ${90-b*70}, ${15+e*120} ${90-f*70}, 135 20" fill="none" stroke="var(--accent)" stroke-width="2"/><line x1="15" y1="90" x2="135" y2="90" stroke="var(--border)"/><text x="15" y="104">${n}</text><text x="15" y="12">${d}</text></svg>`}).join('')}</div>
  <p class="sub" style="margin-top:10px">90 / 160 / 240 / 360 ms 四档；位移 ≤ 8px，缩放 ≥ 0.96；hover 不上浮。</p>
</section>`
document.write(tpl('light') + tpl('dark'))
</script>
</div>
</body>
</html>
